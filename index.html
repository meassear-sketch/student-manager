<style>
:root {
  --canvas: #F5F5F7; --surface: #FFFFFF; --track: #E8E8ED; --ink: #1D1D1F; --ink-2: #6E6E73;
  --pill: #1D1D1F; --pill-fg: #FFFFFF; --focus: #2E6BE6; --hair: #E5E5EA;
  --accent: #1E6A7C; --m: #2E6BE6; --f: #E0527A; --bad: #C0392B;
  --ui: "Kantumruy Pro", "Noto Sans Khmer", system-ui, sans-serif;
  --latin: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #000; --surface: #1C1C1E; --track: #2C2C2E; --ink: #F5F5F7; --ink-2: #A1A1A6;
    --pill: #F5F5F7; --pill-fg: #1D1D1F; --hair: #2C2C2E; --accent: #6FB8C9; --m: #6FA8FF; --f: #FF7AA0; --bad: #FF6B5E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #000; --surface: #1C1C1E; --track: #2C2C2E; --ink: #F5F5F7; --ink-2: #A1A1A6;
  --pill: #F5F5F7; --pill-fg: #1D1D1F; --hair: #2C2C2E; --accent: #6FB8C9; --m: #6FA8FF; --f: #FF7AA0; --bad: #FF6B5E; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 120px max(20px, env(safe-area-inset-left, 0px)); }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5px var(--focus); }
.wrap { max-width: 980px; margin: 0 auto; }
.latin { font-family: var(--latin); font-feature-settings: "tnum" 1; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 92px; width: auto; display: block; border-radius: 12px; background: #fff; padding: 4px; box-sizing: content-box; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.brand .kh { font-weight: 600; font-size: 16px; }
.brand .en { font-family: var(--latin); font-size: 12px; color: var(--ink-2); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; background: var(--track); border-radius: 999px; padding: 5px; gap: 2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 10px 18px; border-radius: 999px; min-height: 44px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--pill); color: var(--pill-fg); font-weight: 600; }
.seg.small button { padding: 7px 14px; min-height: 36px; font-size: 14px; }
.row-tabs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 24px; }
.row-tabs > .seg:first-child { grid-column: 2; }
.row-tabs > .seg:last-child { grid-column: 3; justify-self: end; }
@media (max-width: 560px) { .row-tabs { grid-template-columns: 1fr; justify-items: center; } .row-tabs > .seg:first-child, .row-tabs > .seg:last-child { grid-column: 1; justify-self: center; } }
.hero { padding: 24px 0 4px; text-align: center; }
.hero h1 { display: inline-flex; align-items: center; gap: 14px; margin: 0; font-family: var(--latin); font-size: clamp(40px, 8vw, 64px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
html[lang="km"] .hero h1 { font-family: "Battambang", "Kantumruy Pro", serif; font-weight: 700; letter-spacing: 0; line-height: 1.15; }

.search { margin: 18px auto 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 2px 14px; max-width: 360px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; padding: 7px 0; color: var(--ink); }
.search input::placeholder { color: var(--ink-2); }
.search:focus-within { box-shadow: 0 0 0 3px var(--focus); }
.search input:focus-visible, .dock input:focus-visible, .dock select:focus-visible { box-shadow: none; }
.note { color: var(--ink-2); font-size: 14px; margin: 10px 4px 0; }
.note.bad { color: var(--bad); }
.list { margin-top: 18px; display: grid; gap: 10px; }
.item { background: var(--surface); border-radius: 20px; padding: 12px 16px; display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 14px; align-items: center; }
.ph { all: unset; cursor: zoom-in; width: 56px; aspect-ratio: 4/5; border-radius: 12px; background: var(--track); display: grid; place-items: center; font-family: var(--latin); font-weight: 600; color: var(--ink-2); max-width: 100%; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who .en { font-family: var(--latin); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; line-height: 1.25; }
.who .kh { color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.chip { background: var(--track); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--ink); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
mark { background: rgba(46,107,230,.18); color: inherit; border-radius: 4px; padding: 0 2px; }
.ic { display: inline-block; vertical-align: -5px; width: 24px; height: 24px; }
.ic-m { color: var(--m); } .ic-f { color: var(--f); }

.card { background: var(--surface); border-radius: 26px; padding: 22px; }
.adm { margin-top: 22px; display: grid; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.stat { background: var(--surface); border-radius: 22px; padding: 18px 20px; min-width: 0; }
.stat .big { font-family: var(--latin); font-weight: 700; font-size: clamp(28px, 4.5vw, 40px); letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .lbl { color: var(--ink-2); font-size: 14px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.stat.acc .big { color: var(--accent); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.head h2 { margin: 0; font-size: 19px; font-weight: 700; }
.hint { color: var(--ink-2); font-size: 13px; }
.by { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0,1fr); gap: 22px; align-items: start; }
.donut { width: 100%; max-width: 280px; height: auto; display: block; margin: 0 auto; position: sticky; top: 90px; }
.arc { cursor: pointer; transition: opacity .2s ease; }
.donut:hover .arc { opacity: .45; }
.donut .arc:hover { opacity: 1; }
.classes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.cls { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); box-shadow: inset 0 0 0 1px var(--track); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.cls .cls-text { flex: 1; display: grid; gap: 4px; min-width: 0; }
.cls .top { font-weight: 700; font-size: 16px; }
.cls .sub { font-size: 13px; }
.cls.back { grid-column: 1 / -1; justify-content: center; color: var(--accent); font-weight: 700; font-size: 15px; box-shadow: inset 0 0 0 1px var(--track); }
.cls .tot { color: var(--ink-2); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cls .sub .ic { width: 16px; height: 16px; vertical-align: -3px; }
.cls:focus-visible { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--focus); }
.cls[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.cls .top { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.cls .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.cls .sub { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cls .tot { margin-left: auto; font-family: var(--latin); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cls .pct { color: var(--ink-2); font-size: 12px; font-family: var(--latin); }
.cls-open { grid-column: 1 / -1; background: var(--canvas); border-radius: 16px; padding: 14px; display: grid; gap: 10px; animation: clsOpen .25s ease; }
.cls-open-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cls-open-info { display: grid; gap: 4px; min-width: 0; }
.cls-open-info h3 { margin: 0; font-size: 17px; font-weight: 700; }
.cls-open-sub { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
@keyframes clsOpen { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cls-open { animation: none; } }
@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .by { grid-template-columns: minmax(0,1fr); }
  .classes { grid-template-columns: minmax(0,1fr); }
}
.btn { border: 0; border-radius: 999px; background: var(--pill); color: var(--pill-fg); padding: 11px 20px; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 44px; white-space: nowrap; }
.btn.ghost { background: var(--track); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: grid; gap: 8px; }
.field label { font-size: 14px; color: var(--ink-2); }
.field input, .field select { border: 0; background: var(--track); border-radius: 14px; padding: 14px 16px; font-size: 16px; outline: none; color: var(--ink); min-height: 50px; width: 100%; }
.field input:focus { box-shadow: 0 0 0 3px var(--focus); }
.gate { display: grid; gap: 0; max-width: 340px; margin: 0 auto; width: 100%; padding: 26px 22px 22px; text-align: center; justify-items: stretch; }
.lock-ic { width: 52px; height: 64px; margin: 0 auto 10px; }
.lock-ic svg { width: 100%; height: 100%; display: block; }
.gate-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.01em; }
.gate .pin { width: 100%; box-sizing: border-box; height: 48px; border: 0; border-radius: 14px; background: var(--canvas); color: var(--ink); font-size: 18px; text-align: center; letter-spacing: .35em; outline: none; }
.gate .pin:focus { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px #2E6B77; }
.gate .note.bad { margin-top: 12px; }
.gate .btn.teal { width: 100%; height: 46px; margin-top: 20px; border-radius: 14px; background: #2E6B77; color: #fff; font-size: 16px; min-height: 46px; }
.gate .big { font-family: var(--latin); font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
.h-ic { width: .62em; height: .62em; flex: none; }
.tab-ic { width: 16px; height: 16px; flex: none; margin-inline-end: 6px; }
.row-tabs .seg button { display: inline-flex; align-items: center; justify-content: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
.rowc { display: grid; grid-template-columns: 62px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--hair); }
.rowc:first-child { border-top: 0; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: blur(14px); }
.dock-in { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; align-items: center; background: var(--surface); border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
.dock input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; padding: 10px 0; color: var(--ink); }
.dock input::placeholder { color: var(--ink-2); }
.dock select { border: 0; background: var(--track); border-radius: 999px; padding: 10px 14px; font-size: 14px; outline: none; min-height: 44px; max-width: 170px; color: var(--ink); }
@media (max-width: 560px) {
  .dock-in { flex-wrap: wrap; border-radius: 22px; padding: 10px 12px; }
  .dock input { flex-basis: 100%; padding: 8px 4px; }
  .dock select { flex: 1; max-width: none; }
  .dock .btn { flex: 1; }
}
.progress { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
.drop { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px; border: 1.5px dashed var(--ink-2); border-radius: 18px; cursor: pointer; color: var(--ink-2); text-align: center; font-size: 14px; }
.drop svg { width: 30px; height: 30px; }
.drop.over { border-color: var(--focus); color: var(--ink); background: var(--canvas); }
.lb { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,.4); backdrop-filter: blur(8px); padding: 16px; }
.lb .sheet { width: min(360px, 100%); background: var(--surface); border-radius: 26px; padding: 16px; display: grid; gap: 14px; }
.lb .big { aspect-ratio: 4/5; border-radius: 18px; background: var(--track); display: grid; place-items: center; font-family: var(--latin); font-size: 60px; font-weight: 600; color: var(--ink-2); overflow: hidden; }
.lb .big img { width: 100%; height: 100%; object-fit: cover; }
.lb dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.lb dt { color: var(--ink-2); }
.lb dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>

      return !q || matchRow(r, q);
    });
    if (!rows.length) { var e = document.createElement("div"); e.className = "note"; e.textContent = t("empty"); box.appendChild(e); return; }
    rows.slice(0, 300).forEach(function (r) { box.appendChild(studentRow(r, q, true)); });
  }
  function buildGradeSelect() {
    var sel = $("dgrade"), prev = sel.value;
    sel.innerHTML = "";
    var all = document.createElement("option"); all.value = ""; all.textContent = t("all"); sel.appendChild(all);
    var set = {};
    state.students.forEach(function (r) { set[r.grade || "-"] = 1; });
    Object.keys(set).sort(function (a, b) { return gradeKey(a) - gradeKey(b); }).forEach(function (g) {
      var o = document.createElement("option"); o.value = g; o.textContent = gradeLabel(g); sel.appendChild(o);
    });
    sel.value = prev || "";
  }

  // ---- admin auth ----
  async function checkAdminSetup() {
    // password is set by the owner directly in Supabase; the app only asks for it
    showGate("login");
  }
  function showGate(which) {
    $("gate-setup").hidden = which !== "setup";
    $("gate-login").hidden = which !== "login";
    $("panel").hidden = true;
    $("dock").hidden = true;
  }
  function showPanel() {
    $("gate-setup").hidden = true;
    $("gate-login").hidden = true;
    $("panel").hidden = false;
    $("dock").hidden = false;
    state.admin = true;
    renderAdmin();
  }
  $("s-go").addEventListener("click", async function () {
    var a = $("s-pw1").value, err = $("s-err");
    err.hidden = true;
    if (a.length < 12) { err.textContent = state.lang === "km" ? "យ៉ាងតិច ១២ តួអក្សរ" : "At least 12 characters"; err.hidden = false; return; }
    var r = await rpc("admin_setup", { new_pw: a });
    if (r.error) { err.textContent = r.error.message; err.hidden = false; return; }
    state.adminPw = a;
    $("s-pw1").value = "";
    showPanel();
  });
  $("l-go").addEventListener("click", async function () {
    var pw = $("l-pw").value, err = $("l-err");
    err.hidden = true;
    var r = await rpc("admin_verify", { pw: pw });
    if (r.error) { err.textContent = lockMsg(r.error); err.hidden = false; return; }
    if (!r.data) { err.textContent = state.lang === "km" ? "លេខសម្ងាត់មិនត្រឹមត្រូវ" : "Wrong password"; err.hidden = false; return; }
    state.adminPw = pw;
    $("l-pw").value = "";
    showPanel();
  });
  $("l-pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("l-go").click(); });
  $("s-pw1").addEventListener("keydown", function (e) { if (e.key === "Enter") $("s-go").click(); });

  $("c-go").addEventListener("click", async function () {
    var cur = $("c-cur").value, nw = $("c-new").value;
    var err = $("c-err"), ok = $("c-ok");
    err.hidden = true; ok.hidden = true;
    if (nw.length < 12) { err.textContent = state.lang === "km" ? "យ៉ាងតិច ១២ តួអក្សរ" : "At least 12 characters"; err.hidden = false; return; }
    var r = await rpc("admin_change_password", { current_pw: cur, new_pw: nw });
    if (r.error) { err.textContent = lockMsg(r.error); err.hidden = false; return; }
    if (!r.data) { err.textContent = state.lang === "km" ? "លេខសម្ងាត់បច្ចុប្បន្នមិនត្រឹមត្រូវ" : "Current password is wrong"; err.hidden = false; return; }
    state.adminPw = nw;
    $("c-cur").value = ""; $("c-new").value = "";
    ok.hidden = false;
  });

  // ---- Excel import (one sheet = one academic year) ----
  var HEAD = {
    "nº": "no", "no": "no", "name in english": "name_en", "name in khmer": "name_kh",
    "student id": "student_id", "sex": "sex", "gender": "sex", "stugroup": "stu_group", "grade": "grade",
    "date of birth": "date_of_birth", "old/new": "old_new", "academics": "academics",
    "academicyear": "academics", "academic year": "academics"
  };
  function toIsoDate(v) {
    if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
    if (typeof v === "number") { var d = XLSX.SSF.parse_date_code(v); if (d) return d.y + "-" + String(d.m).padStart(2, "0") + "-" + String(d.d).padStart(2, "0"); }
    if (typeof v === "string" && /^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(v.trim())) return v.trim().slice(0, 10);
    return null;
  }
  function mapSheet(ws) {
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "", blankrows: false });
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return String(h || "").trim().toLowerCase(); });
    var idx = {};
    head.forEach(function (h, i) { if (HEAD[h]) idx[HEAD[h]] = i; });
    var out = [];
    rows.slice(1).forEach(function (row) {
      var get = function (k) { return idx[k] === undefined ? "" : row[idx[k]]; };
      var sid = String(get("student_id")).trim();
      if (!sid) return;
      var sexRaw = String(get("sex")).trim().toLowerCase();
      var sex = sexRaw === "m" || sexRaw === "male" || sexRaw === "ប្រុស" ? "M" : (sexRaw === "f" || sexRaw === "female" || sexRaw === "ស្រី" ? "F" : "");
      out.push({
        no: get("no") === "" ? null : Number(get("no")),
        name_en: String(get("name_en")).trim(),
        name_kh: String(get("name_kh")).trim(),
        student_id: sid,
        sex: sex || null,
        stu_group: String(get("stu_group")).trim() || null,
        grade: String(get("grade")).trim() || null,
        date_of_birth: toIsoDate(get("date_of_birth")),
        old_new: String(get("old_new")).trim() || null,
        academics: String(get("academics")).trim() || null
      });
    });
    return out;
  }
  function setStatus(msg, bad) {
    var el = $("imp-status"); el.hidden = !msg; el.textContent = msg || ""; el.className = "note" + (bad ? " bad" : "");
  }
  function setProgress(p) {
    var bar = $("imp-bar"); bar.hidden = p === null;
    bar.firstElementChild.style.width = (p || 0) + "%";
  }
  $("import").addEventListener("click", function () { $("file").click(); });
  function passFile(f) {
    var dt = new DataTransfer(); dt.items.add(f);
    $("file").files = dt.files;
    $("file").dispatchEvent(new Event("change"));
  }
  $("file2").addEventListener("change", function (e) { if (e.target.files[0]) passFile(e.target.files[0]); e.target.value = ""; });
  var drop = $("drop");
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files[0]) passFile(e.dataTransfer.files[0]);
  });
  drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file2").click(); } });
  // ---- student photos (file name = student ID) ----
  var pdrop = $("pdrop");
  function setPStatus(msg, bad) { var el = $("pstatus"); el.hidden = !msg; el.textContent = msg || ""; el.className = "note" + (bad ? " bad" : ""); }
  function setPBar(p) { var bar = $("pbar"); bar.hidden = p === null; bar.firstElementChild.style.width = (p || 0) + "%"; }
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var W = 360, H = 450;
        var c = document.createElement("canvas"); c.width = W; c.height = H;
        var s = Math.max(W / img.width, H / img.height);
        var w = img.width * s, h = img.height * s;
        c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }
  function photoIdFromName(name, known) {
    var base = String(name).replace(/[.][^.]+$/, "").trim();
    if (known[base]) return base;
    var best = "";
    Object.keys(known).forEach(function (id) { if (id.length > best.length && base.indexOf(id) >= 0) best = id; });
    if (best) return best;
    var m = base.match(/[0-9]{4,}/);
    return m ? m[0] : base;
  }
  async function uploadPhotos(files) {
    var list = Array.prototype.slice.call(files);
    var known = {};
    state.all.forEach(function (r) { known[r.student_id] = 1; });
    var ok = 0, miss = 0, fail = 0, stop = null, badNames = [];
    for (var i = 0; i < list.length && !stop; i++) {
      var f = list[i];
      var sid = photoIdFromName(f.name, known);
      setPStatus((i + 1) + " / " + list.length + " · " + sid);
      try {
        var b64 = await compressImage(f);
        var r = await callPhotoFn({ pw: state.adminPw, student_id: sid, data: b64 });
        if (!r.ok) {
          var code = r.status;
          if (code === 401) stop = state.lang === "km" ? "លេខសម្ងាត់មិនត្រឹមត្រូវ" : "Wrong password";
          else if (code === 423) stop = lockMsg({ message: "too many attempts" });
          else { fail++; if (code === 400 && badNames.length < 5) badNames.push(sid); }
        } else if (r.data && r.data.rows > 0) ok++;
        else miss++;
      } catch (e) { fail++; }
      setPBar(Math.round(((i + 1) / list.length) * 100));
    }
    setPBar(null);
    if (stop) {
      setPStatus(stop, true);
    } else {
      var msg = (state.lang === "km" ? "បានបញ្ចូល " : "Uploaded ") + ok;
      if (miss) msg += (state.lang === "km" ? " · គ្មានអត្តលេខក្នុងបញ្ជី " : " · no matching ID ") + miss;
      if (fail) msg += (state.lang === "km" ? " · បរាជ័យ " : " · failed ") + fail;
      if (badNames.length) msg += (state.lang === "km" ? " · ឈ្មោះមិនត្រឹមត្រូវ៖ " : " · bad names: ") + badNames.join(", ");
      setPStatus(msg, miss > 0 || fail > 0);
    }
    await init(true);
  }
  $("pfile").addEventListener("change", function (e) {
    var arr = Array.prototype.slice.call(e.target.files);
    e.target.value = "";
    if (arr.length) uploadPhotos(arr);
  });
  pdrop.addEventListener("dragover", function (e) { e.preventDefault(); pdrop.classList.add("over"); });
  pdrop.addEventListener("dragleave", function () { pdrop.classList.remove("over"); });
  pdrop.addEventListener("drop", function (e) {
    e.preventDefault(); pdrop.classList.remove("over");
    var arr = Array.prototype.slice.call(e.dataTransfer.files);
    if (arr.length) uploadPhotos(arr);
  });
  pdrop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("pfile").click(); } });

  $("file").addEventListener("change", async function (e) {
    var f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      var buf = await f.arrayBuffer();
      var wb = XLSX.read(buf, { type: "array" });
      var jobs = [];
      wb.SheetNames.forEach(function (name) {
        var year = /^[0-9]{4}-[0-9]{4}$/.test(name.trim()) ? name.trim() : null;
        if (!year) year = prompt((state.lang === "km" ? "ឆ្នាំសិក្សាសម្រាប់ sheet «" : 'School year for sheet "') + name + (state.lang === "km" ? "» (ឧ. 2026-2027)" : '" (e.g. 2026-2027)'), "");
        if (year && /^[0-9]{4}-[0-9]{4}$/.test(year.trim())) jobs.push({ year: year.trim(), rows: mapSheet(wb.Sheets[name]), name: name });
      });
      if (!jobs.length) { setStatus(t("empty"), true); return; }
      var NL = String.fromCharCode(10);
      var summary = jobs.map(function (j) { return j.name + " → " + j.year + " (" + j.rows.length + ")"; }).join(NL);
      if (!confirm(summary + NL + NL + "OK?")) return;
      for (var j = 0; j < jobs.length; j++) {
        var job = jobs[j], done = 0, CH = 300;
        for (var i = 0; i < job.rows.length; i += CH) {
          var chunk = job.rows.slice(i, i + CH);
          var r = await rpc("admin_import_students", { pw: state.adminPw, p_year: job.year, rows: chunk });
          if (r.error || r.data === -1) { setStatus(r.error ? lockMsg(r.error) : (state.lang === "km" ? "លេខសម្ងាត់មិនត្រឹមត្រូវ (សូមចូល Admin ម្តងទៀត)" : "Wrong password. Sign in again."), true); setProgress(null); return; }
          done += chunk.length;
          setProgress(Math.round((done / job.rows.length) * 100));
          setStatus(job.year + " · " + done + " / " + job.rows.length);
        }
      }
      setStatus(state.lang === "km" ? "នាំចូលរួចរាល់" : "Import complete");
      setProgress(null);
      await init(true);
    } catch (err) {
      setStatus(String(err && err.message || err), true);
      setProgress(null);
    }
  });

  $("del-year").addEventListener("click", async function () {
    if (!state.year) return;
    if (!confirm((state.lang === "km" ? "លុបទិន្នន័យទាំងអស់របស់ " : "Delete all data for ") + state.year + "?")) return;
    var r = await rpc("admin_delete_year", { pw: state.adminPw, p_year: state.year });
    if (r.error || r.data === -1) { setStatus(r.error ? lockMsg(r.error) : (state.lang === "km" ? "លេខសម្ងាត់មិនត្រឹមត្រូវ" : "Wrong password"), true); return; }
    setStatus(state.lang === "km" ? "បានលុប " + r.data + " ជួរ" : "Deleted " + r.data + " rows");
    await init(true);
  });

  // ---- wiring ----
  $("q").addEventListener("input", renderLookup);
  $("dq").addEventListener("input", function () { state.dq = $("dq").value; renderStudentsCard(); });
  $("dgrade").addEventListener("change", function () {
    var v = $("dgrade").value;
    state.cls = v === "" ? null : v;
    state.grade = v === "" ? null : levelOf(v);
    renderAdmin();
  });
  $("year").addEventListener("change", async function () {
    state.year = $("year").value;
    state.grade = null;
    loadStudents();
    buildGradeSelect();
    renderLookup();
    if (state.admin) renderAdmin();
  });
  $("c-go").setAttribute("type", "button");
  function closeLb() { $("lb").hidden = true; }
  $("lb-close").addEventListener("click", closeLb);
  $("lb").addEventListener("click", function (e) { if (e.target === $("lb")) closeLb(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLb(); });
  document.querySelectorAll("[data-lang-set]").forEach(function (b) {
    b.addEventListener("click", function () { state.lang = b.getAttribute("data-lang-set"); applyStatic(); });
  });
  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  $("theme").addEventListener("click", function () {
    dark = !dark;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  });
  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.addEventListener("click", async function () {
      var admin = b.getAttribute("data-tab") === "admin";
      document.querySelectorAll("[data-tab]").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
      $("view-find").hidden = admin;
      $("view-admin").hidden = !admin;
      $("dock").hidden = true;
      updateH1();
      if (admin) {
        if (state.admin) showPanel(); else await checkAdminSetup();
      }
    });
  });

  async function init(keepAdmin) {
    try {
      await loadAll();
      loadYears();
      loadStudents();
      buildGradeSelect();
      applyStatic();
      if (keepAdmin && state.admin) renderAdmin();
    } catch (err) {
      $("list").innerHTML = '<div class="note bad">' + esc(err.message || err) + '</div>';
    }
  }

  applyStatic();
  init(false);
})();
</script>
